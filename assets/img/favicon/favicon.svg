<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: #1a1918; }
    .fg { fill: #f8f7f4; }
    .ring { stroke: rgba(248, 247, 244, 0.22); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f8f7f4; }
      .fg { fill: #1a1918; }
      .ring { stroke: rgba(26, 25, 24, 0.22); }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <rect class="ring" x="4" y="4" width="56" height="56" rx="11" fill="none" stroke-width="1"/>
  <text class="fg" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="1">SF</text>
</svg>
